rules:
  # 1. Todo o Controller tem de ter o trio de Guards declarado na classe
  - id: nestjs-controller-missing-security-guards
    languages: [typescript]
    severity: ERROR
    message: >-
      Todo o Controller deve declarar @UseGuards(...) contendo JwtAuthGuard ao nível da classe.
    paths:
      include:
        - 'src/**/*.controller.ts'
    patterns:
      - pattern: |
          @Controller(...)
          export class $CONTROLLER { ... }
      - pattern-not: |
          @UseGuards(..., JwtAuthGuard, ...)
          @Controller(...)
          export class $CONTROLLER { ... }
      - pattern-not: |
          @Controller(...)
          @UseGuards(..., JwtAuthGuard, ...)
          export class $CONTROLLER { ... }

  # 2. Todo o endpoint HTTP tem de ter @Roles(...)
  - id: nestjs-method-missing-roles-decorator
    languages: [typescript]
    severity: ERROR
    message: >-
      Método HTTP sem decorator @Roles(...) explícito.
    paths:
      include:
        - 'src/**/*.controller.ts'
    patterns:
      # Captura qualquer método com verbo HTTP
      - pattern-either:
          - pattern: |
              @Get(...)
              $METHOD(...) { ... }
          - pattern: |
              @Post(...)
              $METHOD(...) { ... }
          - pattern: |
              @Put(...)
              $METHOD(...) { ... }
          - pattern: |
              @Delete(...)
              $METHOD(...) { ... }
          - pattern: |
              @Patch(...)
              $METHOD(...) { ... }
      # Não pode conter @Roles acima (sintaxe válida sem elipse isolada)
      - pattern-not-inside: |
          @Roles(...)
          $METHOD(...) { ... }
      - pattern-not-inside: |
          @Roles(...)
          @$OTHER_DEC(...)
          $METHOD(...) { ... }
      - pattern-not-inside: |
          @$OTHER_DEC(...)
          @Roles(...)
          $METHOD(...) { ... }

  # 3. Rotas parametrizadas com :parametro devem ter @FgaAuthorized
  - id: nestjs-parameterized-route-missing-fga
    languages: [typescript]
    severity: WARNING
    message: >-
      Endpoint parametrizado sem @FgaAuthorized(...). Valida se requer ReBAC via OpenFGA.
    paths:
      include:
        - 'src/**/*.controller.ts'
    patterns:
      - pattern-either:
          - pattern: |
              @Get($ROUTE)
              $METHOD(...) { ... }
          - pattern: |
              @Post($ROUTE)
              $METHOD(...) { ... }
          - pattern: |
              @Put($ROUTE)
              $METHOD(...) { ... }
          - pattern: |
              @Delete($ROUTE)
              $METHOD(...) { ... }
          - pattern: |
              @Patch($ROUTE)
              $METHOD(...) { ... }
      # Filtra rotas que têm ":" no path (ex: ':websiteId')
      - metavariable-regex:
          metavariable: $ROUTE
          regex: '.*:.*'
      # Exclui se tiver o decorator @FgaAuthorized
      - pattern-not-inside: |
          @FgaAuthorized(...)
          $METHOD(...) { ... }
      - pattern-not-inside: |
          @FgaAuthorized(...)
          @$DEC(...)
          $METHOD(...) { ... }
      - pattern-not-inside: |
          @$DEC1(...)
          @FgaAuthorized(...)
          @$DEC2(...)
          $METHOD(...) { ... }

  # 4. Tipagem estrita de retorno em Controllers
  - id: nestjs-avoid-any-return-in-controller
    languages: [typescript]
    severity: WARNING
    message: >-
      Uso de Promise<any> ou any detetado. Usa DTOs tipados.
    paths:
      include:
        - 'src/**/*.controller.ts'
    patterns:
      - pattern: |
          async $METHOD(...): Promise<any> { ... }
