name: 'Security & Quality Gate (Shift-Left)'

on:
  push:
    branches: [main, develop, monitor-server-v2]
  pull_request:
    branches: [main, develop, monitor-server-v2]

permissions:
  contents: read
  security-events: write # Upload de SARIF para GitHub Code Scanning
  actions: read

jobs:
  # 1. CODE QUALITY & BUILD VALIDATION
  code-quality:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Linter Checks
        run: npm run lint

      - name: Verify TypeScript Compilation
        run: npm run build

  # 2. SAST
  sast-semgrep:
    name: SAST — Semgrep Pro
    runs-on: ubuntu-latest
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep & Pro Engine
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep install-semgrep-pro

      - name: Run Semgrep Pro
        run: |
          semgrep scan --pro \
            --config p/nestjs \
            --config p/typescript \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-pro

  # 3. SBOM
  sca-dependencies:
    name: SCA — Dependencies & Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Audit Dependencies (NPM Audit)
        run: npm audit --audit-level=high

      - name: Check Disallowed Licenses
        run: |
          npx license-checker \
            --failOn 'GPL;AGPL;SSPL;LGPL-2.0' \
            --excludePrivatePackages \
            --json > licenses.json

      - name: Upload License Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  # 4. Linting do Dockerfile
  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # 5.Container Vulnerabilities
  container-security:
    name: Container Vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: app:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:local-scan
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
