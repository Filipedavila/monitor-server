name: Secure CI Pipeline (Shift-Left)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  static-analysis:
    name: Code Quality & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Linter & Formatting Checks
        run: npm run lint

  security-scan:
    name:  Vulnerability & SCA Scanning
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true 
  test-pipeline:
    name: Compilation & Automated Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget gnupg libatk1.0-0 libatk-bridge2.0-0t64 \
            libgdk-pixbuf2.0-0 libgtk-3-0t64 libgbm-dev \
            libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Clean Install Dependencies
        run: npm ci

      - name: Verify NestJS Build Compilation
        run: npm run build

      - name: Execute Unit Tests
        run: npm run test

      - name: Execute E2E Tests (QualWeb Engine)
        run: npm run test:e2e
        env:
          NODE_ENV: test