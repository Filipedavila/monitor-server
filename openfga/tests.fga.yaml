name: "Monitor Server ReBAC Model Validation"
model_file: ./model.fga

tuples:

  # Creation of users with specific roles
  - user: "user:admin1"
    relation: "member"
    object: "role:admin"

  - user: "user:admin2"
    relation: "member"
    object: "role:admin"

  - user: "user:estudante1"
    relation: "member"
    object: "role:study"

  ## Assign main permissions to admin resources
  - user: "role:admin"
    relation: "admin"
    object: "directory:all"
  - user: "role:admin"
    relation: "admin"
    object: "tag:all"
  - user: "role:admin"
    relation: "admin"
    object: "accessibility_statement:all"

  ## criar default team 
  - user: "role:admin"
    relation: "admin"
    object: "team:pending"

  # ---ORGANIZATIO 1 ---
  ## creation of userx for team 1
  - user: "user:monitor1"
    relation: "member"
    object: "role:monitor"

  - user: "user:monitor2"
    relation: "member"
    object: "role:monitor"

  - user: "role:admin"
    relation: "admin"
    object: "team:1"

  ## Other team and user for testing isolation
  - user: "user:monitor_other"
    relation: "member"
    object: "role:monitor"
  - user: "role:admin"
    relation: "admin"
    object: "team:other_org"
  ## Assign User 1 as local admin and user 2 as local member of team 1


  - user: "user:monitor1"
    relation: "admin"
    object: "team:1"

  - user: "user:monitor2"
    relation: "member"
    object: "team:1"

  - user: "user:monitor_other"
    relation: "admin"
    object: "team:other_org"

  # --Websites, Org and Pages---
  - user: "team:1"
    relation: "parent"
    object: "website:site_a"
  - user: "user:monitor1"
    relation: "owner"
    object: "website:site_a"
  - user: "user:estudante1"
    relation: "study_assignee"
    object: "website:site_a"
  ## Pages created for website A
  - user: "website:site_a"
    relation: "parent"
    object: "page:site_a_home"

  ## Website created by admin without team defined (pending flow)
  - user: "user:admin1"
    relation: "owner"
    object: "website:site_b_no_org"
  - user: "team:pending"
    relation: "parent"
    object: "website:site_b_no_org"

  ## Crawler for a Website
  - user: "website:site_a"
    relation: "parent"
    object: "crawler_website:crawler1"

  - user: "crawler_website:crawler1"
    relation: "parent"
    object: "crawler_page:crawler1_page1"
  # --- EVALUATIONS ---
  - user: "user:monitor1"
    relation: "owner"
    object: "evaluation:eval_1"
  - user: "website:site_a"
    relation: "parent"
    object: "evaluation:eval_1"

    # Evaluation by Admin Role
  - user: "website:site_a"
    relation: "parent"
    object: "evaluation:eval_admin"
  - user: "role:admin"
    relation: "owner"
    object: "evaluation:eval_admin"

tests:
  - name: "1. Organization Access Control"
    check:
      # Test Global Admin (via Role) should have manage and view access to the team
      - user: "user:admin1"
        object: "team:1"
        assertions:
          can_manage: true
      # Test Local Admin of Organization 1 should have manage access to the team
      - user: "user:monitor1"
        object: "team:1"
        assertions:
          can_manage: true
      # Test Local Member of Organization 1 should have view and edit but not full manage access
      - user: "user:monitor2"
        object: "team:1"
        assertions:
          can_manage: false

  - name: "2. Website and Page Inheritance"
    check:
      # Local Admin inheriting permissions on the Page
      - user: "user:monitor1"
        object: "page:site_a_home"
        assertions:
          can_manage: true
      # Student assigned to the site should have view access but not edit
      - user: "user:estudante1"
        object: "page:site_a_home"
        assertions:
          can_view: true
          can_edit: false

  - name: "3. Website sem Organização (Pending Flow)"
    check:
      # Admin1 should be able to manage because they are the creator AND because org:pending has role:admin
      - user: "user:admin1"
        object: "website:site_b_no_org"
        assertions:
          can_manage: true
      # Admin2 should also be able to manage because of role:admin
      - user: "user:admin2"
        object: "website:site_b_no_org"
        assertions:
          can_manage: true

  - name: "4. Evaluation Logic (Intersection Check)"
    check:
      - user: "user:admin1"
        object: "evaluation:eval_admin"
        assertions:
          can_manage: true
      # Monitor1 is creator of eval_1 so should have manage and view access to it
      - user: "user:monitor1"
        object: "evaluation:eval_1"
        assertions:
          can_manage: true
      # Student1 cannot view eval 1 because it did not created it.
      - user: "user:estudante1"
        object: "evaluation:eval_1"
        assertions:
          can_view: false
      - user: "user:monitor2"
        object: "evaluation:eval_admin"
        assertions:
          can_view: false

  - name: "5. Directory and Global Tags"
    check:
      # User admin1 is part of role:admin which is linked to directory:all, so it should have access to directory:all
      - user: "user:admin1"
        object: "directory:all"
        assertions:
          can_manage: true
      # Monitor1 is not of role admin so it should not have access to directory:all
      - user: "user:monitor1"
        object: "directory:all"
        assertions:
          can_view: false

  - name: "6. Accessibility Statement"
    check:
      - user: "user:admin1"
        object: "accessibility_statement:all"
        assertions:
          can_manage: true
      - user: "user:estudante1"
        object: "accessibility_statement:all"
        assertions:
          can_view: false
  - name: "7. Crawler Access Control"
    check:
    ## user from a certain team can access its crawler resources
      - user: "user:monitor1"
        object: "crawler_website:crawler1"
        assertions:
          can_manage: true
      - user: "user:monitor1"
        object: "crawler_page:crawler1_page1"
        assertions:
          can_manage: true
    ## user from a certain team cannot access crawler resources of another team
      - user: "user:monitor_other"
        object: "crawler_website:crawler1"
        assertions:
          can_view: false
          can_manage: false
      - user: "user:monitor_other"
        object: "crawler_page:crawler1_page1"
        assertions:
          can_view: false
          can_manage: false

        